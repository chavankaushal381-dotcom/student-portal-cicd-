
apiVersion: v1
kind: ConfigMap
metadata:
  name: student-portal-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>CSA3004 Student Portal</title>
    </head>
    <body>
      <h1>to the Student Portal</h1>
      <p>Course: Cloud Native Orchestration</p>
      <p>Deployment: Docker + Amazon EKS</p>
      <p>Version: 1</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-portal
  template:
    metadata:
      labels:
        app: student-portal
    spec:
      containers:
        - name: student-portal
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: html-volume
          configMap:
            name: student-portal-html
---
apiVersion: v1
kind: Service
metadata:
  name: student-portal-service
spec:
  selector:
    app: student-portal
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
